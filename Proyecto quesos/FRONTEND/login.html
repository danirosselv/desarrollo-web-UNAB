<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Iniciar Sesion — Quesos SK</title>
<style>
  :root {
    --primary: #d97706;
    --primary-dark: #b45309;
    --primary-light: #fef3c7;
    --bg: linear-gradient(135deg, #fefce8 0%, #fef3c7 50%, #fed7aa 100%);
    --card: #fff;
    --text: #1c1917;
    --muted: #78716c;
    --line: #e7e5e4;
    --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .container {
    width: 100%;
    max-width: 440px;
  }
  
  .card {
    background: var(--card);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 48px 40px;
    position: relative;
    overflow: hidden;
  }
  
  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
  }
  
  .logo-section {
    text-align: center;
    margin-bottom: 32px;
  }
  
  .logo-section img {
    height: 80px;
    margin-bottom: 16px;
  }
  
  .logo-section h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 28px;
    color: var(--text);
    font-weight: 700;
    margin-bottom: 8px;
  }
  
  .logo-section p {
    color: var(--muted);
    font-size: 15px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
  }
  
  .input-wrapper {
    position: relative;
  }
  
  .input-wrapper svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--muted);
  }
  
  input {
    width: 100%;
    padding: 14px 16px 14px 48px;
    border: 2px solid var(--line);
    border-radius: 12px;
    font-size: 15px;
    background: #fafaf9;
    transition: all 0.3s ease;
  }
  
  input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px var(--primary-light);
  }
  
  input::placeholder {
    color: #a8a29e;
  }
  
  .btn-primary {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 8px;
  }
  
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px -5px rgba(217, 119, 6, 0.4);
  }
  
  .btn-primary:active {
    transform: translateY(0);
  }
  
  .divider {
    display: flex;
    align-items: center;
    margin: 28px 0;
    color: var(--muted);
    font-size: 13px;
  }
  
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  
  .divider span {
    padding: 0 16px;
  }
  
  .register-link {
    text-align: center;
  }
  
  .register-link p {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 12px;
  }
  
  .btn-secondary {
    display: inline-block;
    padding: 12px 32px;
    background: #fff;
    color: var(--primary-dark);
    border: 2px solid var(--primary);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s ease;
  }
  
  .btn-secondary:hover {
    background: var(--primary-light);
    transform: translateY(-2px);
  }
  
  .message {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    margin-top: 16px;
    display: none;
  }
  
  .message.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fca5a5;
  }
  
  .message.success {
    display: block;
    background: #d1fae5;
    color: #065f46;
    border: 1px solid #6ee7b7;
  }
  
  .back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }
  
  .back-link:hover {
    color: var(--primary-dark);
  }
  
  @media (max-width: 480px) {
    .card {
      padding: 36px 24px;
    }
    .logo-section h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-section">
        <img src="img/logo.png" alt="Quesos SK" onerror="this.style.display='none'">
        <h1>Bienvenido</h1>
        <p>Ingresa a tu cuenta para continuar</p>
      </div>
      
      <form id="form">
        <div class="form-group">
          <label for="email">Correo electronico</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <input id="email" type="email" placeholder="tu@correo.com" required>
          </div>
        </div>
        
        <div class="form-group">
          <label for="pass">Contrasena</label>
          <div class="input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input id="pass" type="password" placeholder="Tu contrasena" required>
          </div>
        </div>
        
        <button type="submit" class="btn-primary">Iniciar Sesion</button>
        
        <div id="msg" class="message"></div>
      </form>
      
      <div class="divider">
        <span>o si eres nuevo</span>
      </div>
      
      <div class="register-link">
        <p>Aun no tienes cuenta?</p>
        <a href="registro.html" class="btn-secondary">Crear Cuenta</a>
      </div>
    </div>
    
    <a href="index.html" class="back-link">← Volver a la tienda</a>
  </div>

<script>
const API_URL = "http://localhost:8000";
const $form = document.getElementById("form");
const $msg = document.getElementById("msg");

$form.addEventListener("submit", async e => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value.trim();
  
  if (!email || !pass) { 
    $msg.className = "message error";
    $msg.textContent = "Ingresa correo y contrasena";
    return;
  }

  try {
    const formData = new URLSearchParams();
    formData.append("username", email);
    formData.append("password", pass);

    const res = await fetch(`${API_URL}/auth/token`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: formData
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || "Credenciales incorrectas");
    }

    const data = await res.json();
    
    localStorage.setItem("qs_token", data.access_token);
    localStorage.setItem("qs_session", JSON.stringify({
      email: email,
      nombre: data.nombre || email,
      rol: data.rol || "USER"
    }));

    $msg.className = "message success";
    $msg.textContent = "Ingreso exitoso! Redirigiendo...";
    
    setTimeout(() => {
      location.href = "index.html";
    }, 800);
  } catch (err) {
    $msg.className = "message error";
    $msg.textContent = err.message;
  }
});
</script>

<footer class="site-footer">
  <div class="footer-bottom">
    <p>&copy; 2025 Quesos SK Inc. Todos los derechos reservados.</p>
  </div>
</footer>

<style>
  .site-footer{position:fixed;bottom:0;left:0;right:0;background:#1c1917}
  .footer-bottom{text-align:center;padding:12px}
  .footer-bottom p{font-size:11px;color:#78716c;margin:0}
</style>
</body>
</html>
